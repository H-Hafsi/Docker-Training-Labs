# ---------------------------------------------------------------
# Dépôt modèle : site de cours (MkDocs Material + GitHub Pages)
# À personnaliser : site_name, site_url, repo_url, extra.matiere, nav
# ---------------------------------------------------------------
site_name: "Docker"
site_description: Cours et travaux pratiques – Master DevOps et Cloud Computing, ISET Tozeur
site_url: https://h-hafsi.github.io/Docker-Training-Labs/
repo_url: https://github.com/H-Hafsi/Docker-Training-Labs
repo_name: H-Hafsi/Docker-Training-Labs
copyright: © 2026 ISET Tozeur – Département Informatique

theme:
  name: material
  custom_dir: overrides
  language: fr
  logo: assets/img/profile.jpg
  favicon: assets/img/profile.jpg
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: fr

# Textes de la page d'accueil (voir overrides/home.html)
extra:
  matiere:
    etiquette: "Master DevOps et Cloud Computing · ISET Tozeur"
    titre: "Docker : conteneurisation, orchestration et industrialisation d'applications"
    sous_titre: "Construire, distribuer, sécuriser, orchestrer avec Swarm et livrer par CI/CD des applications conteneurisées."
    premier_lien: partie-1-fondations/ch01-introduction-aux-conteneurs/cours/
    chiffres:
      - { valeur: "45 h", libelle: "de formation" }
      - { valeur: "3", libelle: "crédits ECTS" }
      - { valeur: "4", libelle: "parties" }
      - { valeur: "Docker", libelle: "moteur de TP" }
      - { valeur: "Swarm", libelle: "orchestration" }

